<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07160f;
    --surface: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    --text: #f4f7ea;
    --muted: #a3b8a9;
    --border: rgba(236,248,137,0.14);
    --accent: #ecf889;
    --accent-contrast: #0a2013;
    --danger: #fca5a5;
    --radius: 16px;
    --radius-sm: 10px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow: 0 1px 0 rgba(236,248,137,0.05) inset, 0 16px 34px -18px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(236,248,137,0.06), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 100%, rgba(16,91,47,0.35), transparent 60%),
      linear-gradient(160deg, #0f2c1c 0%, var(--bg) 55%, #051007 100%);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .stage { width: 100%; max-width: 880px; animation: fadeUp 0.7s var(--ease) both; padding-top: 24px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
    color: var(--muted); text-decoration: none; cursor: pointer; border: 1px solid transparent;
    background: none; padding: 6px 10px; margin-bottom: 18px; border-radius: 999px;
    transition: background 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s var(--ease);
  }
  .back:hover { background: rgba(236,248,137,0.06); color: var(--accent); border-color: var(--border); }
  .back svg { width: 14px; height: 14px; }
  h1 { font-family: "Fraunces", serif; font-style: italic; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; margin: 0 0 6px; text-align: center; }
  p.sub { margin: 0 0 32px; text-align: center; color: var(--muted); font-size: 14px; }
  .card {
    position: relative; background: var(--surface); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow);
    animation: rise 0.6s var(--ease) 0.05s both; overflow: hidden;
    transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
  }
  .card::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(480px circle at var(--x, 50%) var(--y, 0%), rgba(236,248,137,0.07), transparent 55%);
    opacity: 0; transition: opacity 0.4s var(--ease); pointer-events: none;
  }
  .card:hover { border-color: rgba(236,248,137,0.28); box-shadow: var(--shadow), 0 0 0 1px rgba(236,248,137,0.15); }
  .card:hover::before { opacity: 1; }
  .card > * { position: relative; z-index: 1; }
  .search-row { display: flex; gap: 10px; align-items: flex-end; }
  .search-row .field { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text); }
  .search-input-wrap { position: relative; }
  .search-input-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--muted); pointer-events: none;
  }
  .search-input-wrap input { padding-left: 38px; }
  input {
    width: 100%; font-family: inherit; font-size: 14px; padding: 12px 14px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: rgba(255,255,255,0.03); color: var(--text); outline: none;
    transition: border-color 0.25s var(--ease), background 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  input::placeholder { color: var(--muted); opacity: 0.7; }
  input:focus {
    border-color: var(--accent); background: rgba(236,248,137,0.05);
    box-shadow: 0 0 0 3px rgba(236,248,137,0.12);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 13px 20px;
    border-radius: 999px; border: 1px solid transparent; cursor: pointer; white-space: nowrap;
    transition: transform 0.3s var(--ease), opacity 0.25s var(--ease), background 0.3s var(--ease), box-shadow 0.3s var(--ease);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -8px rgba(236,248,137,0.45); opacity: 1; }
  .btn:focus-visible, .back:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .message {
    margin-top: 18px; padding: 12px 14px; border-radius: var(--radius-sm);
    background: rgba(236,248,137,0.08); border: 1px solid rgba(236,248,137,0.18);
    color: var(--text); font-size: 13px; font-weight: 600;
  }
  .message.error { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.28); color: var(--danger); }
  .results { margin-top: 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .product-card {
    position: relative; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    overflow: hidden; display: flex; flex-direction: column;
    animation: rise 0.5s var(--ease) both;
    transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.3s var(--ease);
  }
  .product-card::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(360px circle at var(--x, 50%) var(--y, 0%), rgba(236,248,137,0.1), transparent 55%);
    opacity: 0; transition: opacity 0.4s var(--ease); pointer-events: none;
  }
  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow), 0 0 0 1px rgba(236,248,137,0.22);
    border-color: var(--accent);
  }
  .product-card:hover::before { opacity: 1; }
  .product-card > * { position: relative; z-index: 1; }
  .product-photo {
    width: 100%; height: 160px; background: rgba(236,248,137,0.05);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .product-photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .product-photo svg { width: 30px; height: 30px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .product-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
  .product-id { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .product-name { font-family: "Fraunces", serif; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .product-price { font-size: 15px; font-weight: 700; color: var(--accent); }
  .product-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }
  @media (max-width: 640px) { h1 { font-size: 22px; } .card { padding: 22px; } .search-row { flex-direction: column; align-items: stretch; } .results { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <main class="stage">
    <a class="back" href="product-management.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back
    </a>

    <h1>Search Product</h1>
    <p class="sub">Search for products by name or ID.</p>

    <div class="card">
      <div class="search-row">
        <div class="field">
          <label for="searchName">Product name or ID</label>
          <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchName" placeholder="e.g. Wireless Mouse or 12" />
          </div>
        </div>
        <button type="button" class="btn btn-primary" onclick="searchProducts()">Search</button>
      </div>

      <div id="messageArea"></div>
      <div class="results" id="results"></div>
    </div>
  </main>

  <script>
    // ─── Auth Guard ─────────────────────────
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    if (!token || role !== 'ADMIN') {
      window.location.replace('/login.html');
    }

    function getAuthHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('token')
      };
    }

    async function searchProducts() {
      const rawInput = document.getElementById("searchName").value.trim();
      const messageArea = document.getElementById("messageArea");
      const results = document.getElementById("results");

      messageArea.innerHTML = "";
      results.innerHTML = "";

      if (!rawInput) {
        messageArea.innerHTML = `<div class="message error">Please enter a product name or ID to search.</div>`;
        return;
      }

      const query = rawInput.toLowerCase();

      try {
        // FIXED: correct URL + Authorization header
        const response = await fetch("/admin/viewAllProduct", {
          method: "GET",
          headers: getAuthHeaders()
        });

        if (!response.ok) {
          console.error("Server responded with error status:", response.status);
          messageArea.innerHTML = `<div class="message error">Unable to search products right now (error ${response.status}).</div>`;
          return;
        }

        let allProducts = await response.json();

        if (!Array.isArray(allProducts)) {
          if (Array.isArray(allProducts.products)) {
            allProducts = allProducts.products;
          } else {
            console.error("Unexpected product data shape:", allProducts);
            messageArea.innerHTML = `<div class="message error">Unexpected product data format.</div>`;
            return;
          }
        }

        const matches = allProducts.filter(product => {
          const nameMatch = product.name && product.name.toLowerCase().includes(query);
          const idMatch = product.id !== undefined && product.id !== null &&
            String(product.id).toLowerCase() === query;
          return nameMatch || idMatch;
        });

        if (matches.length === 0) {
          results.innerHTML = `<div class="empty-state">No products found matching "${rawInput}".</div>`;
          return;
        }

        matches.forEach(product => {
          const card = document.createElement("div");
          card.className = "product-card";

          // FIXED: use imageUrl instead of photoUrl
          const photoHtml = product.imageUrl
            ? `<img src="${product.imageUrl}" alt="${product.name}" onerror="this.style.display='none'; this.parentElement.innerHTML += placeholderIcon();" />`
            : placeholderIcon();

          card.innerHTML = `
            <div class="product-photo">${photoHtml}</div>
            <div class="product-body">
              <div class="product-id">ID: ${product.id}</div>
              <div class="product-name">${product.name}</div>
              <div class="product-price">$${product.price}</div>
              <div class="product-desc">${product.description || ""}</div>
            </div>
          `;
          results.appendChild(card);
        });

      } catch (err) {
        console.error("Network error while fetching products:", err);
        messageArea.innerHTML = `<div class="message error">Could not reach the server. Please check your connection and try again.</div>`;
      }
    }

    function placeholderIcon() {
      return `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
    }

    document.getElementById("searchName").addEventListener("keydown", function (e) {
      if (e.key === "Enter") searchProducts();
    });
  </script>

  <script>
    document.querySelectorAll('.card').forEach(function (card) {
      card.addEventListener('mousemove', function (e) {
        var rect = card.getBoundingClientRect();
        card.style.setProperty('--x', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--y', (e.clientY - rect.top) + 'px');
      });
    });

    var resultsContainer = document.getElementById('results');
    if (resultsContainer) {
      resultsContainer.addEventListener('mousemove', function (e) {
        var target = e.target.closest('.product-card');
        if (!target) return;
        var rect = target.getBoundingClientRect();
        target.style.setProperty('--x', (e.clientX - rect.left) + 'px');
        target.style.setProperty('--y', (e.clientY - rect.top) + 'px');
      });
    }
  </script>
</body>
</html>
